<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taskly">
<title>Accedi · Taskly</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script>try{var t=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<button id="tema" type="button" aria-label="Passa al tema scuro" title="Cambia tema">
  <svg class="sole" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="luna" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M21 14.5A9 9 0 0 1 9.5 3a9 9 0 1 0 11.5 11.5z"/></svg>
</button>

<main class="auth-screen">
  <div class="auth-box">
    <div class="brand auth-brand">
      <img src="icon.svg" alt="Taskly" class="brand-logo" width="48" height="48">
      <span class="brand-name">Task<span class="brand-acc">ly</span></span>
    </div>
    <p class="auth-sub">Gestisci i tuoi impegni e le circolari scolastiche personali</p>

    <div class="auth-tabs" role="tablist">
      <button type="button" id="tabLogin" class="attivo" role="tab" aria-selected="true">Accedi</button>
      <button type="button" id="tabReg" role="tab" aria-selected="false">Registrati</button>
    </div>

    <form id="frmAuth" autocomplete="on">
      <label>Nome utente
        <input id="username" name="username" maxlength="50" autocomplete="username" placeholder="es. mario.rossi" required>
      </label>
      <label id="wrapEmail" hidden>Email per promemoria (opzionale)
        <input id="email" name="email" type="email" maxlength="120" autocomplete="email" placeholder="tuamail@esempio.it">
      </label>
      <label>Password
        <input id="password" name="password" type="password" minlength="4" maxlength="100" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <button type="submit" id="btnSubmit" class="primary auth-submit">Entra nel calendario</button>
    </form>
  </div>
</main>

<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
let mod = 'login', tt;

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : '');
  clearTimeout(tt); tt = setTimeout(() => t.className = '', 5000);
}

function impostaMod(m) {
  mod = m;
  const isReg = m === 'register';
  $('tabLogin').classList.toggle('attivo', !isReg);
  $('tabLogin').setAttribute('aria-selected', String(!isReg));
  $('tabReg').classList.toggle('attivo', isReg);
  $('tabReg').setAttribute('aria-selected', String(isReg));
  $('wrapEmail').hidden = !isReg;
  $('password').autocomplete = isReg ? 'new-password' : 'current-password';
  $('btnSubmit').textContent = isReg ? 'Crea account e accedi' : 'Entra nel calendario';
}

$('tabLogin').onclick = () => impostaMod('login');
$('tabReg').onclick = () => impostaMod('register');

$('frmAuth').onsubmit = async e => {
  e.preventDefault();
  const btn = $('btnSubmit');
  btn.disabled = true;
  try {
    const body = {
      username: $('username').value.trim(),
      password: $('password').value
    };
    if (mod === 'register') body.email = $('email').value.trim();
    const r = await fetch(`/api/auth/${mod}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.errore || 'Errore durante l\'autenticazione');
    location.href = '/';
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
  }
};

function applicaTema(t) {
  document.documentElement.dataset.theme = t;
  $('tema').setAttribute('aria-label', t === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro');
  try { localStorage.setItem('tema', t); } catch {}
}
$('tema').onclick = () => applicaTema(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
applicaTema(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
</script>
</body>
</html>
