<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taskly">
<title>Taskly</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script>try{var t=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="pannello" type="button" aria-label="Apri menu" title="Menu">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
<div id="velo" hidden></div>
<button id="tema" type="button" aria-label="Passa al tema scuro" title="Cambia tema">
  <svg class="sole" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="luna" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M21 14.5A9 9 0 0 1 9.5 3a9 9 0 1 0 11.5 11.5z"/></svg>
</button>
<aside>
  <div class="brand-bar">
    <div class="brand">
      <img src="icon.svg" alt="Taskly" class="brand-logo" width="32" height="32">
      <span class="brand-name">Task<span class="brand-acc">ly</span></span>
    </div>
    <div class="user-box">
      <span id="utenteNome" class="user-badge" title="Utente connesso"></span>
      <button id="esci" type="button" class="btn-esci" title="Esci dall'account">Esci</button>
    </div>
  </div>
  <button id="nuovo" class="primary">+ nuovo</button>
  <div class="periodo">
    <select id="mese" aria-label="Mese"></select>
    <input id="anno" type="number" min="2000" max="2100" aria-label="Anno">
  </div>
  <div class="nav"><button id="prec" aria-label="Mese precedente">‹</button><button id="oggi">Oggi</button><button id="succ" aria-label="Mese successivo">›</button></div>
  <section class="elenco">
    <h2>Tutti i programmi</h2>
    <ul id="elenco" aria-live="polite"></ul>
  </section>
  <section class="circolare">
    <h2>Circolari</h2>
    <input type="file" id="pdf" accept="application/pdf">
    <div class="riga"><input id="classe" maxlength="7" placeholder="Classe (es. III F)"><button id="addClasse">Aggiungi</button></div>
    <div id="chips"></div>
    <button id="analizza" class="primary">Analizza circolare</button>
  </section>
</aside>
<main id="cal"></main>

<dialog id="dlg">
  <form id="frm">
    <h2>Nuovo programma</h2>
    <label>Tipo<input name="tipo" maxlength="35" required></label>
    <label>Descrizione<input name="descrizione" maxlength="150"></label>
    <div class="riga">
      <label>Inizio<input name="ora_inizio" type="time" required></label>
      <label>Fine<input name="ora_fine" type="time" required></label>
    </div>
    <div class="riga">
      <label>Giorno<input name="giorno" type="number" min="1" max="31" required></label>
      <label>Colore<input name="colore" type="color" value="#0e7c66"></label>
    </div>
    <label>Email per il promemoria<input name="email" type="email" maxlength="120"></label>
    <label>Minuti di anticipo<input name="promemoria" type="number" min="0" max="1440" value="30"></label>
    <div class="riga fine"><button type="button" id="annulla">Annulla</button><button class="primary">Salva programma</button></div>
  </form>
</dialog>
<div id="menu" role="menu" hidden><button type="button" id="elimina" role="menuitem">Elimina</button></div>
<div id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
